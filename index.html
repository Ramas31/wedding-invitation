
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f2eb">

  <title>Rama & Shreyank | Wedding Invitation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f7f2eb;
      overflow-x: hidden;
    }

    .page {
      height: 100vh;
      height: 100dvh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      overflow: hidden;
    }

    .page img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    @media (max-width: 600px) {
      .page {
        padding: 0;
      }

      .page img {
        max-width: 100vw;
        max-height: 100dvh;
      }
    }
  </style>
</head>

<body>

<section class="page">
  <img src="pages/1.png" alt="Wedding invitation cover">
</section>

<section class="page">
  <img src="pages/2.png" alt="Wedding ceremony details">
</section>

<section class="page">
  <img src="pages/3.png" alt="Pre-wedding celebrations">
</section>

<section class="page">
  <img src="pages/4.png" alt="Sangeet">
</section>

<section class="page">
  <img src="pages/5.png" alt="Closing invitation">
</section>

</body>
</html>
