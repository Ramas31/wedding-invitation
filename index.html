<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4eee5">
  <meta name="description" content="Rama & Shreyank • Wedding celebrations, 13–15 February 2027, Hubballi">
  <title>Rama & Shreyank | Wedding Invitation</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100dvh; font-family:Georgia,serif; background:radial-gradient(circle at center,#fffaf4 0%,#f0e9df 95%); color:#244657; }
    main { min-height:100dvh; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:16px; padding:24px 12px max(22px,env(safe-area-inset-bottom)); }
    h1 { font-size:clamp(18px,2.6vw,25px); font-weight:normal; letter-spacing:.04em; margin:0; text-align:center; }
    .book-stage { width:min(94vw,980px); display:flex; justify-content:center; align-items:center; min-height:min(70dvh,630px); }
    #book { width:360px; height:504px; }
    .page { background:#fff; overflow:hidden; }
    .page img { width:100%; height:100%; object-fit:fill; display:block; }
    nav { display:flex; align-items:center; gap:20px; }
    button { font:inherit; font-size:14px; border:1px solid #c3b096; background:#fffaf2; color:#23485b; border-radius:999px; padding:10px 18px; cursor:pointer; }
    button:hover { background:#f8eedc; }
    button:disabled { opacity:.4; cursor:default; }
    #counter { font:13px system-ui,sans-serif; min-width:76px; text-align:center; color:#63737a; }
    .hint { font:12px system-ui,sans-serif; color:#7c8285; text-align:center; margin:0; }
    @media(max-width:600px) { main {gap:12px;padding:18px 8px 24px;} .book-stage{min-height:0;height:min(72dvh,640px);width:100%;} #book{width:320px;height:448px;} nav{gap:12px} }
  </style>
</head>
<body>
<main>
  <h1>Rama &amp; Shreyank</h1>
  <div class="book-stage"><div id="book">
    <div class="page" data-density="hard"><img src="pages/page-1.jpg" alt="Wedding invitation cover"></div>
    <div class="page"><img src="pages/page-2.jpg" alt="Wedding ceremony and family details"></div>
    <div class="page"><img src="pages/page-3.jpg" alt="Engagement, Mehendi and Haldi details"></div>
    <div class="page"><img src="pages/page-4.jpg" alt="Sangeet details"></div>
    <div class="page" data-density="hard"><img src="pages/page-5.jpg" alt="Closing message"></div>
  </div></div>
  <nav aria-label="Flipbook navigation">
    <button type="button" id="prev" aria-label="Previous page">← Previous</button>
    <span id="counter" aria-live="polite">1 / 5</span>
    <button type="button" id="next" aria-label="Next page">Next →</button>
  </nav>
  <p class="hint">Swipe or tap a page corner to turn • Use the arrows to navigate</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
  const prev=document.getElementById('prev');
  const next=document.getElementById('next');
  const counter=document.getElementById('counter');
  if (window.St && St.PageFlip) {
    const flip=new St.PageFlip(document.getElementById('book'), {
      width:360,height:504,size:'stretch',minWidth:230,maxWidth:440,
      minHeight:322,maxHeight:616,drawShadow:true,flippingTime:750,
      usePortrait:true,showCover:true,autoSize:true,maxShadowOpacity:.35,
      mobileScrollSupport:true,swipeDistance:25
    });
    flip.loadFromHTML(document.querySelectorAll('#book .page'));
    const update=()=>{
      const idx=flip.getCurrentPageIndex();
      counter.textContent=(idx+1)+' / '+flip.getPageCount();
      prev.disabled=idx===0;next.disabled=idx>=flip.getPageCount()-1;
    };
    flip.on('flip',update);flip.on('init',update);flip.on('changeOrientation',update);
    prev.addEventListener('click',()=>flip.flipPrev());
    next.addEventListener('click',()=>flip.flipNext());
    update();
  } else {
    document.querySelector('.hint').textContent='Page-turning requires an internet connection. The invitation images are included in the pages folder.';
    prev.hidden=true;next.hidden=true;counter.hidden=true;
    document.getElementById('book').style.cssText='width:min(85vw,360px);height:auto';
    document.querySelectorAll('.page').forEach(e=>e.style.cssText='display:block;margin:12px 0');
  }
</script>
</body>
</html>
