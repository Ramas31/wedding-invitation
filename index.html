<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e7dfd3">
<title>Rama &amp; Shreyank | Wedding Invitation</title>
<style>
  :root { color-scheme: light; --paper: #f2eadf; --ink: #142e3e; }
  * { box-sizing: border-box; }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; }
  body { background: var(--paper); font-family: Georgia, serif; overscroll-behavior:none; }
  .viewer { position:relative; width:100%; height:100%; height:100dvh; display:grid; place-items:center; overflow:hidden; perspective:1800px; isolation:isolate; touch-action:pan-y; }
  .viewer::before { content:""; position:absolute; inset:-12%; background:radial-gradient(ellipse at center, #faf6ee 0%, #eae1d5 62%, #d4c8b8 100%); z-index:-2; }
  .viewer::after { content:""; position:absolute; left:15%; right:15%; bottom:0; height:13%; background:radial-gradient(ellipse at center, #1b283329, transparent 70%); filter:blur(28px); z-index:-1; pointer-events:none; }
  .card { position:relative; max-width:calc(100vw - 32px); max-height:calc(100dvh - 32px); width:min(calc((100dvh - 32px) * 0.7142857), calc(100vw - 32px)); aspect-ratio:5 / 7; transform-style:preserve-3d; filter:drop-shadow(0 14px 24px #23323b31); cursor:pointer; }
  .sheet { width:100%; height:100%; position:absolute; inset:0; backface-visibility:hidden; transform-origin:left center; will-change:transform,opacity; background:#f7f1e7; }
  .sheet img { width:100%; height:100%; object-fit:contain; display:block; user-select:none; -webkit-user-drag:none; }
  .sheet.next { z-index:1; }
  .sheet.current { z-index:2; }
  .sheet.turn-forward { animation:turnForward 720ms cubic-bezier(.45,.08,.2,.99) both; }
  .sheet.turn-back { transform-origin:right center; animation:turnBack 720ms cubic-bezier(.45,.08,.2,.99) both; }
  @keyframes turnForward { 0% { transform:rotateY(0); opacity:1; } 58% { opacity:.95; } 100% { transform:rotateY(-105deg); opacity:0; } }
  @keyframes turnBack { 0% { transform:rotateY(0); opacity:1; } 58% { opacity:.95; } 100% { transform:rotateY(105deg); opacity:0; } }
  @media (max-width:600px) {
    .card { width:min(calc((100dvh - 12px) * .7142857), 100vw); max-width:100vw; max-height:calc(100dvh - 12px); filter:drop-shadow(0 7px 16px #23323b24); }
  }
  @media (prefers-reduced-motion:reduce) { .sheet.turn-forward,.sheet.turn-back { animation-duration:1ms; } }
</style>
</head>
<body>
<main class="viewer" id="viewer" aria-label="Wedding invitation. Swipe or scroll to turn pages.">
  <div class="card" id="card">
    <div class="sheet next" id="incoming"><img id="nextImg" alt=""></div>
    <div class="sheet current" id="outgoing"><img id="currentImg" src="pages/1.png" alt="Rama and Shreyank wedding invitation cover"></div>
  </div>
</main>
<script>
(() => {
  const pages = [
    ['pages/1.png','Rama and Shreyank wedding invitation cover'],
    ['pages/2.png','Wedding invitation and family details'],
    ['pages/3.png','Engagement, Mehendi and Haldi celebrations'],
    ['pages/4.png','Sangeet celebration'],
    ['pages/5.png','Blessings and closing invitation']
  ];
  let index = 0, busy = false, startX = 0, startY = 0, lastWheel = 0;
  const viewer = document.getElementById('viewer');
  const card = document.getElementById('card');
  const outgoing = document.getElementById('outgoing');
  const incoming = document.getElementById('incoming');
  const currentImg = document.getElementById('currentImg');
  const nextImg = document.getElementById('nextImg');
  function preload(i) { if (i >= 0 && i < pages.length) { const im = new Image(); im.src = pages[i][0]; } }
  preload(1);
  function turn(dir) {
    const target = index + dir;
    if (busy || target < 0 || target >= pages.length) return;
    busy = true;
    nextImg.src = pages[target][0]; nextImg.alt = pages[target][1];
    incoming.style.visibility = 'visible';
    outgoing.classList.remove('turn-forward','turn-back');
    void outgoing.offsetWidth;
    outgoing.classList.add(dir > 0 ? 'turn-forward' : 'turn-back');
    const done = () => {
      index = target;
      currentImg.src = pages[index][0]; currentImg.alt = pages[index][1];
      outgoing.classList.remove('turn-forward','turn-back');
      incoming.style.visibility = 'hidden';
      busy = false;
      preload(index+1); preload(index-1);
    };
    outgoing.addEventListener('animationend', done, {once:true});
  }
  viewer.addEventListener('wheel', e => {
    e.preventDefault();
    if (Math.abs(e.deltaY) < 12 || busy) return;
    const now = performance.now(); if (now - lastWheel < 650) return;
    lastWheel = now; turn(e.deltaY > 0 ? 1 : -1);
  }, {passive:false});
  viewer.addEventListener('touchstart', e => {
    startX=e.touches[0].clientX; startY=e.touches[0].clientY;
  }, {passive:true});
  viewer.addEventListener('touchend', e => {
    const dx=e.changedTouches[0].clientX-startX;
    const dy=e.changedTouches[0].clientY-startY;
    if (Math.max(Math.abs(dx),Math.abs(dy)) > 45) turn((Math.abs(dy)>Math.abs(dx) ? dy : dx) < 0 ? 1 : -1);
  }, {passive:true});
  card.addEventListener('click', e => {
    const rect=card.getBoundingClientRect();
    turn(e.clientX-rect.left >= rect.width/2 ? 1 : -1);
  });
  document.addEventListener('keydown', e => {
    if (['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)) { e.preventDefault(); turn(1); }
    else if (['ArrowLeft','ArrowUp','PageUp'].includes(e.key)) { e.preventDefault(); turn(-1); }
  });
  incoming.style.visibility='hidden';
})();
</script>
</body>
</html>
