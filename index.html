
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9e2d7">
<meta name="description"
  content="The wedding celebrations of Rama and Shreyank, 13–15 February 2027, Hubballi.">

<title>Rama & Shreyank | Wedding Invitation</title>

<style>
  :root {
    --cream: #eee8de;
    --navy: #172d3c;
  }

  * {
    box-sizing: border-box;
  }

  html {
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    scrollbar-width: none;
    background: var(--cream);
  }

  html::-webkit-scrollbar {
    display: none;
  }

  body {
    margin: 0;
    overflow-x: hidden;
    font-family: Georgia, serif;
  }

  .page {
    position: relative;
    isolation: isolate;
    width: 100%;
    height: 100vh;
    height: 100svh;
    display: grid;
    place-items: center;
    overflow: hidden;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    background: var(--cream);
  }

  /* Soft ambient background from the invitation */
  .ambience {
    position: absolute;
    inset: -70px;
    z-index: -2;
    background-image: var(--image);
    background-size: cover;
    background-position: center;
    filter: blur(55px) saturate(.55);
    opacity: .35;
    transform: scale(1.12);
  }

  .page::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: rgba(238, 232, 222, .55);
  }

  /* The actual invitation */
  .invitation {
    display: block;
    width: auto;
    height: auto;
    max-width: calc(100vw - 48px);
    max-height: calc(100svh - 64px);
    object-fit: contain;
    box-shadow:
      0 3px 8px rgba(22, 35, 46, .08),
      0 18px 55px rgba(22, 35, 46, .16);
    animation: appear .75s ease-out both;
  }

  @keyframes appear {
    from {
      opacity: .45;
      transform: translateY(12px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @media (max-width: 600px) {
    .invitation {
      max-width: 100vw;
      max-height: 94svh;
      box-shadow:
        0 8px 32px rgba(22, 35, 46, .14);
    }

    .ambience {
      filter: blur(40px) saturate(.65);
      opacity: .48;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    html {
      scroll-behavior: auto;
    }
    .invitation {
      animation: none;
    }
  }
</style>
</head>

<body>

<section class="page">
  <div class="ambience"
       style="--image: url('pages/1.png')"></div>
  <img class="invitation"
       src="pages/1.png"
       alt="Rama and Shreyank wedding invitation cover">
</section>

<section class="page">
  <div class="ambience"
       style="--image: url('pages/2.png')"></div>
  <img class="invitation"
       src="pages/2.png"
       alt="Wedding ceremony invitation"
       loading="lazy">
</section>

<section class="page">
  <div class="ambience"
       style="--image: url('pages/3.png')"></div>
  <img class="invitation"
       src="pages/3.png"
       alt="Engagement, Mehendi and Haldi"
       loading="lazy">
</section>

<section class="page">
  <div class="ambience"
       style="--image: url('pages/4.png')"></div>
  <img class="invitation"
       src="pages/4.png"
       alt="Sangeet celebration"
       loading="lazy">
</section>

<section class="page">
  <div class="ambience"
       style="--image: url('pages/5.png')"></div>
  <img class="invitation"
       src="pages/5.png"
       alt="Wedding invitation closing"
       loading="lazy">
</section>

</body>
</html>
